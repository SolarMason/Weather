<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2A6E"/>
      <stop offset="50%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5AC8FA"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(255,214,10,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,214,10,0)"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="60%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5F0FF"/>
    </linearGradient>
    <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="10"/><feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <path d="M0 100 L1200 100 M0 200 L1200 200 M0 300 L1200 300 M0 400 L1200 400 M0 500 L1200 500"/>
    <path d="M150 0 L150 630 M300 0 L300 630 M450 0 L450 630 M600 0 L600 630 M750 0 L750 630 M900 0 L900 630 M1050 0 L1050 630"/>
  </g>

  <!-- Sun -->
  <circle cx="980" cy="155" r="78" fill="url(#sun)" filter="url(#shadow)"/>

  <!-- Cloud -->
  <g filter="url(#shadow)" transform="translate(820, 240)">
    <path fill="url(#cloud)" d="M50 80 q-50 0 -50 -50 q0 -42 42 -50 q6 -52 60 -52 q40 0 56 30 q14 -12 32 -12 q40 0 44 38 q42 6 42 48 q0 48 -50 48 z"/>
  </g>

  <!-- Rain -->
  <g stroke="#5AC8FA" stroke-width="6" stroke-linecap="round" opacity="0.85" transform="translate(820, 240)">
    <line x1="60" y1="100" x2="50" y2="135"/>
    <line x1="105" y1="100" x2="95" y2="135"/>
    <line x1="150" y1="100" x2="140" y2="135"/>
    <line x1="195" y1="100" x2="185" y2="135"/>
  </g>

  <!-- Title block -->
  <g font-family="-apple-system, 'SF Pro Display', system-ui, sans-serif">
    <text x="80" y="180" font-size="84" font-weight="700" fill="#fff" letter-spacing="-3">Skyline</text>
    <text x="80" y="244" font-size="28" font-weight="500" fill="rgba(255,255,255,0.85)" letter-spacing="-0.5">Weather · Radar · 30-Day Construction Outlook</text>

    <!-- Big temperature display -->
    <text x="80" y="430" font-size="180" font-weight="200" fill="#fff" letter-spacing="-8">72°</text>
    <text x="80" y="475" font-size="32" font-weight="500" fill="rgba(255,255,255,0.92)">Partly Cloudy · Clarks Summit</text>
    <text x="80" y="510" font-size="22" font-weight="500" fill="rgba(255,255,255,0.7)">H: 78°  L: 61°  ·  Feels 70°  ·  60% rain by 4pm</text>

    <!-- Feature pills with inline SVG icons (no emoji font dependency) -->
    <g transform="translate(80, 555)">
      <!-- Pill 1: Animated Radar -->
      <rect x="0" y="0" width="200" height="44" rx="22" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.35)"/>
      <g transform="translate(16, 14)" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round">
        <circle cx="8" cy="8" r="2" fill="#fff" stroke="none"/>
        <path d="M8 8 L14 4"/>
        <path d="M2 8a6 6 0 0 1 6-6"/>
        <path d="M8 14a6 6 0 0 0 6-6"/>
      </g>
      <text x="115" y="29" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Animated Radar</text>

      <!-- Pill 2: Severe Alerts (NWS) -->
      <rect x="212" y="0" width="222" height="44" rx="22" fill="rgba(255,69,58,0.30)" stroke="rgba(255,255,255,0.40)"/>
      <g transform="translate(228, 13)" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 1 L17 16 L1 16 Z"/>
        <line x1="9" y1="6" x2="9" y2="11"/>
        <circle cx="9" cy="13.5" r="0.8" fill="#fff" stroke="none"/>
      </g>
      <text x="333" y="29" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Severe Alerts · NWS</text>

      <!-- Pill 3: 30-Day Construction Outlook -->
      <rect x="446" y="0" width="290" height="44" rx="22" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.35)"/>
      <g transform="translate(462, 14)" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 16 L9 2 L16 16"/>
        <path d="M2 16 L16 16"/>
        <path d="M5 11 L13 11"/>
      </g>
      <text x="601" y="29" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">30-Day Construction Outlook</text>

      <!-- Pill 4: Free PWA -->
      <rect x="748" y="0" width="148" height="44" rx="22" fill="rgba(48,209,88,0.30)" stroke="rgba(255,255,255,0.40)"/>
      <g transform="translate(763, 14)" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="0" width="11" height="16" rx="2"/>
        <line x1="6" y1="13" x2="9" y2="13"/>
      </g>
      <text x="826" y="29" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Free PWA</text>
    </g>
  </g>
</svg>
