<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="50%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#0040DD"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="60%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </radialGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5F0FF"/>
    </linearGradient>
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <circle cx="340" cy="180" r="78" fill="url(#sunGrad)"/>
  <g filter="url(#cloudShadow)">
    <path fill="url(#cloudGrad)" d="M150 340 q-50 0 -50 -50 q0 -42 42 -50 q6 -52 60 -52 q40 0 56 30 q14 -12 32 -12 q40 0 44 38 q42 6 42 48 q0 48 -50 48 z"/>
  </g>
  <g stroke="#5AC8FA" stroke-width="9" stroke-linecap="round" opacity="0.9">
    <line x1="180" y1="395" x2="170" y2="430"/>
    <line x1="225" y1="395" x2="215" y2="430"/>
    <line x1="270" y1="395" x2="260" y2="430"/>
    <line x1="315" y1="395" x2="305" y2="430"/>
  </g>
</svg>
